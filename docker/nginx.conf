# 정적 SPA 서빙만 한다. 라우팅·TLS·도메인은 앞단(Cloudflare Tunnel)이 맡는다.
#
# ⚠️ `/api` 프록시 블록이 여기 없는 것은 의도다. 터널이 `/api/*` 를 백엔드로 보내는 구조라
#    nginx 가 한 번 더 프록시하면 홉만 늘고 타임아웃·버퍼링 설정이 두 군데로 갈린다.
#    터널을 프론트 오리진으로만 붙이는 구성으로 바꾼다면 nginx 에 프록시 블록을 되살리거나,
#    VITE_API_BASE_URL 에 백엔드 절대 URL 을 주고 백엔드 CORS_ORIGINS 를 함께 조정해야 한다.
#
# 치환할 변수가 없으므로 템플릿이 아니라 완성된 conf 로 둔다 — envsubst 를 거치지 않는다.

server {
    # unprivileged 이미지는 uid 101 로 돌아 특권 포트(<1024)를 못 연다. 컨테이너 안에서는
    # 8080 고정이고, 바깥 포트는 오케스트레이션 쪽(devops 저장소)에서 정한다.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # add_header 는 상속이 아니라 교체다 — 아래 location 들도 각자 include 해야 한다.
    # 자세한 이유는 security-headers.conf 주석 참고.
    include /etc/nginx/snippets/security-headers.conf;

    # Vite 는 /assets/ 산출물 이름에 콘텐츠 해시를 박는다. 내용이 바뀌면 파일명이 바뀌므로
    # 영구 캐시가 안전하다.
    #
    # ⚠️ `expires` 지시자를 함께 쓰지 마라. expires 도 Cache-Control 을 만들어내서
    #    응답에 Cache-Control 이 **두 줄** 실린다 (중복 헤더는 캐시·CDN 마다 해석이 갈린다).
    #    max-age 까지 add_header 한 줄에 담는다.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        # 없는 번들은 index.html 로 폴백시키지 않는다. 폴백하면 JS 를 요청한 브라우저가
        # HTML 을 200 으로 받아 "Unexpected token '<'" 로 죽는다 — 404 가 훨씬 읽기 쉽다.
        try_files $uri =404;
    }

    # ⛔ index.html 은 캐시하지 않는다. 이 파일이 어떤 해시 번들을 가리키는지가 배포마다
    #    바뀌는데, 캐시되면 사용자가 옛 index.html → 사라진 번들을 요청해 빈 화면을 본다.
    #    "배포했는데 아무도 새 버전을 못 본다" 의 전형적 원인이다.
    #
    # `no-store` 가 아니라 `no-cache` 다 — 매번 재검증하되 안 바뀌었으면 ETag 로 304 를
    # 받아 본문 전송을 아낀다. no-store 면 그 절약까지 버린다.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA 폴백 — react-router 의 클라이언트 라우트(/inbox, /documents ...)는 서버에
    # 대응하는 파일이 없다. 새로고침·딥링크가 404 나지 않도록 index.html 로 넘긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
