# ⚠️ 이 파일이 따로 있는 이유 — nginx 의 `add_header` 는 **상속이 아니라 교체**다.
#    하위 블록에 add_header 가 하나라도 있으면 상위 블록의 add_header 는 **전부 사라진다**.
#    server 에 보안 헤더를 두고 location 에서 Cache-Control 만 add_header 하면
#    그 location 응답에서 보안 헤더가 조용히 증발한다 (에러도 경고도 없다).
#    그래서 add_header 를 쓰는 블록마다 이 파일을 include 해 되풀이한다.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
